# TensorCore-FPGA CI/CD Pipeline
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ========================================
  # RTL Syntax Check
  # ========================================
  syntax-check:
    name: RTL Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Check Core RTL
        run: iverilog -g2012 -I src/include -o /dev/null src/core/*.v
      - name: Check TinyTapeout RTL
        run: iverilog -g2012 -o /dev/null src/tt/*.v

  # ========================================
  # Cocotb Tests
  # ========================================
  cocotb-tests:
    name: Cocotb Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          pip install cocotb pytest
      - name: Run tests
        run: cd test && make clean && make
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test/results.xml
          overwrite: true

  # ========================================
  # Verilator Lint
  # ========================================
  lint:
    name: Verilator Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint TinyTapeout
        run: |
          verilator --lint-only -Wall src/tt/ProcessingElement.v src/tt/SystolicArray2x2.v src/tt/tt_um_tensorcore.v || true

  # ========================================
  # Yosys Synthesis
  # ========================================
  synthesis:
    name: Yosys Synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Synthesize 2x2 Array
        run: |
          yosys -p "read_verilog -sv src/tt/*.v; hierarchy -top tt_um_tensorcore; proc; opt; stat" | tee synth_2x2.log
      - name: Synthesize 4x4 Array
        run: |
          yosys -p "read_verilog -sv src/tt/ProcessingElement.v src/tt/SystolicArray4x4.v; hierarchy -top systolic_4x4; proc; opt; stat" | tee synth_4x4.log
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-logs
          path: synth_*.log
          overwrite: true

  # ========================================
  # TinyTapeout Hardening Check
  # ========================================
  hardening:
    name: TT Hardening Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Use the official TinyTapeout volare-action
      - name: Install PDK
        uses: TinyTapeout/volare-action@v2
        with:
          pdk_name: sky130
          pdk_version: 0fe599b2afb6708d281543108571e8571bf1677c
          pdk_root: /home/runner/pdk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TT tools
        run: pip install librelane

      - name: Create user config
        run: |
          if [ -f "tt/tt_tool.py" ]; then
            python3 tt/tt_tool.py --create-user-config || echo "Config creation skipped"
          else
            echo "tt_tool.py not found - skipping"
          fi

      - name: Verify synthesis
        run: |
          yosys -p "read_verilog -sv src/tt/*.v; hierarchy -top tt_um_tensorcore; proc; opt; stat"
